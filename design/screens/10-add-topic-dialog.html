<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KDP Lab · Add topic</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;family=Source+Serif+4:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#1C1C1A;background:#F3F3F1}
a{color:#1C1C1A}a:hover{color:#000000}
</style>

<div role="dialog" aria-modal="true" aria-labelledby="at" style="width: 560px; height: 420px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #D9D9D5; border-radius: 16px; padding: 32px; display: flex; flex-direction: column; gap: 18px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C1C1A">
<div style="display: flex; justify-content: space-between; align-items: flex-start"><div style="display: flex; flex-direction: column; gap: 6px"><h2 id="at" style="margin: 0; font-size: 22px; font-weight: 600">Add a topic</h2><p style="margin: 0; font-size: 15px; color: #55554F">Write it as one problem for one reader. You score it next.</p></div><button aria-label="Close" style="width: 44px; height: 44px; border: none; background: transparent; border-radius: 8px; color: #55554F; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Topic<span style="font-size: 13px; font-weight: 400; color: #55554F">Example: "Chair yoga for seniors with limited mobility", not "Yoga"</span><input type="text" value="Beekeeping for suburban backyards" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D9D9D5; border-radius: 8px; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #1C1C1A; border: 2px solid #1C1C1A"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Notes (optional)<textarea rows="3" placeholder="Where the idea came from, reader questions you noticed" style="box-sizing: border-box; padding: 10px 12px; border: 1px solid #D9D9D5; border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 1.5; resize: vertical; color: #1C1C1A"></textarea></label>
<div style="flex-grow: 1"></div>
<div style="display: flex; justify-content: flex-end; gap: 12px"><button style="height: 44px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; font-family: inherit; font-size: 15px; text-decoration: none; box-sizing: border-box; border: 1px solid #D9D9D5; background: #FFFFFF; color: #1C1C1A">Cancel</button><button style="height: 44px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; font-family: inherit; font-size: 15px; text-decoration: none; box-sizing: border-box; border: none; background: #1C1C1A; color: #FFFFFF; font-weight: 500">Add and score</button></div></div>


</body>
</html>
