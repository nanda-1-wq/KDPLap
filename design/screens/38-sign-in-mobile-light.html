<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 24px; background: #F3F3F1; color: #1C1C1A; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px"><div style="display: flex; align-items: center; gap: 10px"><svg width="28" height="28" viewBox="0 0 64 64" role="img" aria-label="KDP Lab logo"><path d="M32 49C26 43.5 17 41.5 9 43V13c9-1.8 17 .6 23 7z" fill="#14213D"/><path d="M32 49C38 43.5 47 41.5 55 43V13c-9-1.8-17 .6-23 7z" fill="#14213D"/><path d="M32 18.5l6 11.5-6 19.5-6-19.5z" fill="#FFFFFF"/><path d="M32 30V46" stroke="#14213D" stroke-width="2"/></svg><span style="font-size: 18px; font-weight: 700; letter-spacing: 0.01em"><span style="color: #14213D">KDP</span><span style="color: #2E6AE6">LAB</span></span></div><div style="display: flex; flex-direction: column; gap: 18px; max-width: 440px"><div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px"><h1 style="margin: 0; font-size: 32px; font-weight: 700; color: #1C1C1A">Welcome back</h1><p style="margin: 0; font-size: 16px; line-height: 1.5; color: #55554F">Sign in to continue your books.</p></div>
<button style="height: 48px; width: 100%; border: 1px solid #D9D9D5; border-radius: 8px; background: #FFFFFF; color: #1C1C1A; font-family: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.2 14.6 2.2 12 2.2 6.6 2.2 2.2 6.6 2.2 12S6.6 21.8 12 21.8c5.8 0 9.6-4 9.6-9.7 0-.7-.1-1.2-.2-1.7z"/></svg>Continue with Google</button><div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #55554F"><span style="flex-grow: 1; height: 1px; background: #D9D9D5"></span>or with email<span style="flex-grow: 1; height: 1px; background: #D9D9D5"></span></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; color: #1C1C1A"><span style="display: flex; justify-content: space-between">Email</span>
<span style="position: relative; display: block"><input type="email" value="nora.hale@example.com" placeholder="" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px 0 14px; border: 1px solid #D9D9D5; border-radius: 8px; background: #FFFFFF; color: #1C1C1A; font-family: inherit; font-size: 15px"></span></label><label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; color: #1C1C1A"><span style="display: flex; justify-content: space-between">Password<a href="#" style="font-size: 14px; font-weight: 500; color: #14213D">Forgot password?</a></span>
<span style="position: relative; display: block"><input type="password" value="••••••••••" placeholder="" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 48px 0 14px; border: 1px solid #D9D9D5; border-radius: 8px; background: #FFFFFF; color: #1C1C1A; font-family: inherit; font-size: 15px"><button type="button" aria-label="Show password" style="position: absolute; right: 4px; top: 4px; width: 40px; height: 40px; border: none; background: transparent; color: #55554F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
<button style="height: 48px; width: 100%; border: none; border-radius: 8px; background: #1C1C1A; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; ">Sign in</button>
<p style="margin: 4px 0 0; font-size: 15px; color: #55554F; text-align: center">New to KDP Lab? <a href="#" style="font-weight: 600; color: #14213D">Create an account</a></p></div></div>
