<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Sign in · KDP Lab</title>
  <link rel="icon" href="design/logo/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design/design-tokens.css" />
  <!-- Hide the form until the session check ends (no flash before the redirect).
       Safety net: shown after 3 s even if the check never finishes. -->
  <script>document.documentElement.classList.add('auth-checking');
    setTimeout(function () { document.documentElement.classList.remove('auth-checking'); }, 3000);</script>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth">
    <main class="auth-main">
      <a class="auth-logo" href="index.html" aria-label="KDP Lab home">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path class="mark" d="M32 49C26 43.5 17 41.5 9 43V13c9-1.8 17 .6 23 7z"/><path class="mark" d="M32 49C38 43.5 47 41.5 55 43V13c-9-1.8-17 .6-23 7z"/><path class="cut" d="M32 18.5l6 11.5-6 19.5-6-19.5z"/><path class="spine" d="M32 30V46" stroke-width="2"/></svg>
        <span class="auth-logo-text"><span class="kdp">KDP</span><span class="lab">LAB</span></span>
      </a>

      <div class="auth-center">
        <div class="auth-stack">
          <div class="auth-head">
            <h1>Welcome back</h1>
            <p>Sign in to continue your books.</p>
          </div>

          <button type="button" class="btn btn-secondary" id="googleBtn" data-google>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.8 1.5l2.6-2.5C16.8 3.2 14.6 2.2 12 2.2 6.6 2.2 2.2 6.6 2.2 12S6.6 21.8 12 21.8c5.8 0 9.6-4 9.6-9.7 0-.7-.1-1.2-.2-1.7z"/></svg>
            Continue with Google
          </button>
          <div class="divider" data-google>or with email</div>

          <div id="formAlert" hidden></div>

          <form id="signinForm" class="auth-stack" novalidate>
            <label class="field">
              <span class="field-top">Email</span>
              <span class="field-box">
                <input class="input" type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error" />
              </span>
              <span class="field-error" id="email-error" hidden></span>
            </label>

            <div class="field">
              <span class="field-top">
                <label for="password">Password</label>
                <a href="forgot-password.html">Forgot password?</a>
              </span>
              <span class="field-box">
                <input class="input has-toggle" type="password" id="password" name="password" autocomplete="current-password" required aria-describedby="password-error" />
                <button type="button" class="pw-toggle" aria-controls="password" aria-pressed="false" aria-label="Show password">
                  <svg class="eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.9 5.2A10 10 0 0112 5c6.5 0 10 7 10 7a17 17 0 01-3.2 4M6.6 6.6A17 17 0 002 12s3.5 7 10 7a9.7 9.7 0 005.4-1.6"/></svg>
                </button>
              </span>
              <span class="field-error" id="password-error" hidden></span>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">Sign in</button>
          </form>

          <p class="auth-switch">New to KDP Lab? <a href="signup.html">Create an account</a></p>
        </div>
      </div>

      <p class="auth-legal">KDP is a trademark of Amazon. KDP Lab is independent and not affiliated with Amazon.</p>
    </main>
    <aside class="auth-panel" aria-hidden="true" data-auth-panel></aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
    integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT"
    crossorigin="anonymous"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      const A = window.kdpAuth;
      const form = document.getElementById('signinForm');
      const emailEl = document.getElementById('email');
      const pwEl = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      const alertEl = document.getElementById('formAlert');

      A.fillPanel();
      A.initPasswordToggles();
      A.initGoogle((msg) => A.showAlert(alertEl, 'error', msg));
      A.redirectIfSignedIn();

      emailEl.addEventListener('input', () => A.setFieldError(emailEl, ''));
      pwEl.addEventListener('input', () => A.setFieldError(pwEl, ''));

      function showNotConfirmed(email) {
        const body = A.showAlert(alertEl, 'error', ['Confirm your email first. Open the link we sent to ', { strong: email }, '.']);
        const resend = document.createElement('button');
        resend.type = 'button';
        resend.className = 'link-btn';
        resend.textContent = 'Resend link';
        resend.addEventListener('click', async () => {
          A.setLoading(resend, true, 'Sending…');
          const { error } = await kdp.resendConfirmation(email);
          A.setLoading(resend, false);
          if (error) {
            A.showAlert(alertEl, 'error', A.networkMessage(error) || "We couldn't send the link. Try again.");
          } else {
            A.showAlert(alertEl, 'success', ['We sent a new link to ', { strong: email }, '. Check your inbox.']);
          }
        });
        body.append(resend);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        A.hideAlert(alertEl);

        const emailOk = A.checkEmail(emailEl);
        const pwOk = pwEl.value.length > 0;
        A.setFieldError(pwEl, pwOk ? '' : 'Enter your password.');
        if (!emailOk) { emailEl.focus(); return; }
        if (!pwOk) { pwEl.focus(); return; }

        const email = emailEl.value.trim();
        A.setLoading(submitBtn, true, 'Signing in…');
        const { error } = await kdp.signIn(email, pwEl.value);

        if (!error) {
          location.href = A.DASHBOARD;
          return;
        }

        A.setLoading(submitBtn, false);
        if (error.code === 'email_not_confirmed') {
          showNotConfirmed(email);
        } else {
          // One message for a wrong email or a wrong password. Never say which.
          A.showAlert(alertEl, 'error', A.networkMessage(error) ||
            "That email and password don't match. Try again or reset your password.");
        }
      });
    })();
  </script>
</body>
</html>
