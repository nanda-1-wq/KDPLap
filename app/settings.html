<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings · KDP Lab</title>
  <link rel="icon" href="../design/logo/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../design/design-tokens.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-shell></aside>

    <main class="app-main">
      <header class="page-head">
        <div>
          <h1>Settings</h1>
          <p>Your account and defaults.</p>
        </div>
      </header>

      <div class="center-state">
        <div class="state-box">
          <div class="state-icon" aria-hidden="true" data-icon="settings"></div>
          <div class="chip-label">COMING IN E11</div>
          <h2>Settings are on their way</h2>
          <p>This page is built in task E11, with your defaults.</p>
            <div class="settings-usage" aria-live="polite" data-usage>
              <div class="stat-label">AI USAGE THIS MONTH</div>
              <div class="skel skel-line"></div>
            </div>
            <p class="account-line">Signed in as <strong id="accountEmail"></strong></p>
            <div class="state-actions">
              <button type="button" class="btn btn-secondary" id="logoutBtn">Log out</button>
            </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
    integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT"
    crossorigin="anonymous"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/new-book.js"></script>
  <script>
  (async function () {
    const user = await kdpShell.init({ active: 'settings' });
    if (!user) return;
    document.querySelector('[data-icon]').innerHTML = kdpShell.icon('settings', 26);
    document.getElementById('accountEmail').textContent = user.email || '';

    // AI usage this month (counted calls only, from the 1st in UTC, like the server).
    const usageEl = document.querySelector('[data-usage]');
    try {
      const [settings, usage] = await Promise.all([kdp.ensureUserSettings(user.id), kdp.getMonthUsage()]);
      if (settings.error || !settings.data || usage.error) throw new Error('usage');
      const limit = settings.data.monthly_token_limit;
      const pct = limit > 0 ? Math.min(100, Math.round((usage.tokens / limit) * 100)) : 100;
      const now = new Date();
      const resets = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1))
        .toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      const fmt = (n) => n.toLocaleString('en-US');
      usageEl.innerHTML = `<div class="stat-label">AI USAGE THIS MONTH</div>
        <p class="settings-usage-line"><strong data-usage-tokens>${fmt(usage.tokens)}</strong> of ${fmt(limit)} tokens · Resets ${resets}</p>
        <div class="bar" role="img" aria-label="${pct}% of this month's AI allowance used"><span style="width: ${pct}%"></span></div>`;
    } catch (err) {
      usageEl.innerHTML = '<div class="stat-label">AI USAGE THIS MONTH</div><p class="settings-usage-line">Not available right now.</p>';
    }
    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', async () => {
      logoutBtn.disabled = true;
      logoutBtn.textContent = 'Logging out…';
      await kdp.signOut();
      location.replace('../login.html');
    });
  })();
  </script>
</body>
</html>
