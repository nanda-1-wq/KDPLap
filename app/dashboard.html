<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Books · KDP Lab</title>
  <link rel="icon" href="../design/logo/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../design/design-tokens.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-shell></aside>

    <main class="app-main" id="main">
      <header class="page-head">
        <div>
          <h1>Books</h1>
          <p id="subtitle">Pick up where you left off.</p>
        </div>
        <label class="search" id="searchBox">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" id="search" placeholder="Search books" aria-label="Search books" autocomplete="off" />
        </label>
      </header>

      <p class="notice" id="notice" role="status" hidden></p>

      <!-- Filled by the script: loading, list, empty, or error -->
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
    integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT"
    crossorigin="anonymous"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/new-book.js"></script>
  <script src="../js/book-actions.js"></script>
  <script>
  (async function () {
    const view = document.getElementById('view');
    const searchBox = document.getElementById('searchBox');
    const searchEl = document.getElementById('search');
    const subtitle = document.getElementById('subtitle');
    const notice = document.getElementById('notice');

    const STEPS = {
      1: ['Plan', '01 Brief'], 2: ['Plan', '02 Research'], 3: ['Plan', '03 Positioning'], 4: ['Plan', '04 Title'],
      5: ['Produce', '05 Outline'], 6: ['Write', '06 Write'], 7: ['Produce', '07 Quality Control'],
      8: ['Package', '08 Format'], 9: ['Package', '09 Cover'], 10: ['Release', '10 Metadata'], 11: ['Release', '11 Publish']
    };
    const LENGTH_RANGES = {
      '5-8k': [5000, 8000], '8-12k': [8000, 12000], '12-20k': [12000, 20000], '20-30k': [20000, 30000], '30k+': [30000, null]
    };
    const MORE_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
    const CHECK_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
    const WARN_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>';

    let books = [];
    let filter = 'all';
    let query = '';

    /* ── Helpers ─────────────────────────────── */

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const num = (n) => n.toLocaleString('en-US');
    const one = (rel) => (Array.isArray(rel) ? rel[0] : rel) || null;   // to-one embeds may come as object or array

    const bookHref = (id) => `book.html?id=${encodeURIComponent(id)}`;

    /** Working title: book title, else the Brief's topic, else "Untitled book". */
    function workingTitle(book) {
      const brief = one(book.book_briefs);
      return (book.title || (brief && brief.topic_text) || '').trim();
    }

    function stepLabel(book) {
      if (book.status === 'completed') return 'Completed';
      const s = STEPS[book.current_step] || STEPS[1];
      return `${s[0]} · ${s[1]}`;
    }

    /** Words planned: sum of chapter targets, else the brief's length range. */
    function wordsText(book) {
      const written = 0;   // counted from sections in E10
      const planned = (book.chapters || []).reduce((sum, c) => sum + (c.word_target || 0), 0);
      if (planned > 0) return { text: `${num(written)} of ${num(planned)} words`, pct: written / planned };
      const brief = one(book.book_briefs);
      const range = brief && LENGTH_RANGES[brief.length_range];
      if (range) {
        const text = range[1] ? `Target ${num(range[0])} to ${num(range[1])} words` : `Target ${num(range[0])}+ words`;
        return { text, pct: 0 };
      }
      return { text: 'No word target yet', pct: 0 };
    }

    function editedText(iso) {
      const then = new Date(iso);
      const mins = Math.round((Date.now() - then) / 60000);
      if (mins < 1) return 'Edited just now';
      if (mins < 60) return `Edited ${mins} minute${mins === 1 ? '' : 's'} ago`;
      const hours = Math.round(mins / 60);
      if (hours < 24) return `Edited ${hours} hour${hours === 1 ? '' : 's'} ago`;
      const days = Math.round(hours / 24);
      if (days === 1) return 'Edited yesterday';
      if (days < 7) return `Edited ${days} days ago`;
      const opts = { month: 'short', day: 'numeric' };
      if (then.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
      return `Edited ${then.toLocaleDateString('en-US', opts)}`;
    }

    /* ── Rendering ───────────────────────────── */

    function statsHtml(stats) {
      const usage = stats.usage;
      const usageCard = usage === undefined
        ? `<div class="skel skel-value"></div><div class="skel skel-line skel-w40"></div>`
        : usage === null
          ? `<div class="stat-value">–</div><div class="stat-note">Not available right now</div>`
          : `<div class="stat-value">${usage.pct}%</div><div class="stat-note">Resets ${usage.resets}</div>
             <div class="bar" role="img" aria-label="${usage.pct}% of this month's AI allowance used"><span style="width: ${usage.pct}%"></span></div>`;
      return `
        <section class="stats" aria-label="Summary">
          <div class="stat"><div class="stat-label">IN PROGRESS</div><div class="stat-value">${stats.inProgress}</div><div class="stat-note">book${stats.inProgress === 1 ? '' : 's'}</div></div>
          <div class="stat"><div class="stat-label">WORDS THIS MONTH</div><div class="stat-value">0</div><div class="stat-note">across all books</div></div>
          <div class="stat"><div class="stat-label">AI USAGE THIS MONTH</div>${usageCard}</div>
        </section>`;
    }

    function coverHtml(book, penName) {
      const title = workingTitle(book) || 'Untitled';
      // A word longer than 8 letters does not fit the cover width at the normal size.
      const long = Math.max(...title.split(/\s+/).map((w) => w.length)) > 8;
      return `<div class="cover-ph" aria-hidden="true">
          <div class="cover-ph-title${long ? ' long' : ''}">${esc(title)}</div>
          <div class="cover-ph-rule"></div>
          <div class="cover-ph-pen">${esc(penName || '')}</div>
        </div>`;
    }

    function cardHtml(book) {
      const pen = one(book.pen_names);
      const penName = pen && pen.name;
      const words = wordsText(book);
      const completed = book.status === 'completed';
      const needsReview = (book.chapters || []).some((c) => c.needs_review);
      const title = workingTitle(book);
      const href = bookHref(book.id);
      const pct = completed ? 100 : Math.round(words.pct * 100);
      return `
        <article class="book-card is-link">
          ${coverHtml(book, penName)}
          <div class="book-body">
            <h2 class="book-title${title ? '' : ' untitled'}"><a href="${href}">${esc(title || 'Untitled book')}</a></h2>
            <div class="book-pen${penName ? '' : ' none'}">${esc(penName || 'No pen name yet')}</div>
            <div class="book-tags">
              <span class="pill">${esc(stepLabel(book))}</span>
              ${book.topic_id ? '' : `<span class="badge badge-warning">${WARN_ICON}Unvalidated topic</span>`}
              ${needsReview ? `<span class="badge badge-warning">${WARN_ICON}Needs review</span>` : ''}
            </div>
            <div class="grow"></div>
            <div class="bar" aria-hidden="true"><span style="width: ${pct}%"></span></div>
            <div class="book-meta"><span>${words.text}</span><span>${editedText(book.updated_at)}</span></div>
          </div>
          <div class="card-actions">
            <button type="button" class="icon-btn card-menu-btn" data-book-menu="${esc(book.id)}"
              aria-haspopup="menu" aria-expanded="false" aria-label="More actions for ${esc(title || 'Untitled book')}">${MORE_ICON}</button>
          </div>
        </article>`;
    }

    function matches(book) {
      if (filter === 'progress' && book.status !== 'in_progress') return false;
      if (filter === 'completed' && book.status !== 'completed') return false;
      if (!query) return true;
      const pen = one(book.pen_names);
      return `${workingTitle(book)} ${pen ? pen.name : ''}`.toLowerCase().includes(query);
    }

    let lastStats = null;

    function renderList(stats) {
      lastStats = stats;
      kdpBookActions.closeMenu(false);   // its card is about to be replaced
      const counts = {
        all: books.length,
        progress: books.filter((b) => b.status === 'in_progress').length,
        completed: books.filter((b) => b.status === 'completed').length
      };
      const tab = (key, label) =>
        `<button type="button" class="tab" data-filter="${key}" aria-pressed="${filter === key}">${label} <span class="count">${counts[key]}</span></button>`;
      const shown = books.filter(matches);
      let grid;
      if (shown.length) {
        grid = shown.map(cardHtml).join('');
      } else if (query) {
        grid = `<p class="inline-note">No books match “${esc(query)}”. <button type="button" class="link-btn" data-clear>Clear search</button></p>`;
      } else {
        grid = `<p class="inline-note">No ${filter === 'completed' ? 'completed' : 'in-progress'} books yet.</p>`;
      }
      view.innerHTML = `
        ${statsHtml(stats)}
        <div class="tabs" role="group" aria-label="Filter books">
          ${tab('all', 'All')}${tab('progress', 'In progress')}${tab('completed', 'Completed')}
        </div>
        <section class="book-grid" aria-label="Your books">${grid}</section>`;
    }

    function renderLoading() {
      const skelCard = `<div class="book-card" aria-hidden="true"><div class="cover-ph skel"></div>
        <div class="book-body"><div class="skel skel-title"></div><div class="skel skel-line skel-w30"></div>
        <div class="skel skel-pill"></div><div class="grow"></div>
        <div class="skel skel-bar"></div><div class="skel skel-line"></div></div></div>`;
      const skelStat = `<div class="stat" aria-hidden="true"><div class="skel skel-line skel-w40"></div><div class="skel skel-value"></div><div class="skel skel-line skel-w30"></div></div>`;
      view.innerHTML = `<p class="sr-only" role="status">Loading your books…</p>
        <section class="stats">${skelStat}${skelStat}${skelStat}</section>
        <section class="book-grid">${skelCard}${skelCard}</section>`;
    }

    function renderEmpty() {
      subtitle.hidden = true;
      searchBox.hidden = true;
      view.innerHTML = `
        <div class="center-state">
          <div class="state-box">
            <div class="shelf" aria-hidden="true"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>
            <h2>Your shelf is empty</h2>
            <p>Every book starts from a topic that passed market validation. Score an idea in Topic Lab, then start the book from there.</p>
            <div class="state-actions">
              <a class="btn btn-primary" href="topic-lab.html">${kdpShell.icon('topics', 18)}Open Topic Lab</a>
              <button type="button" class="btn btn-secondary" data-new-book="none">Start without a topic</button>
            </div>
          </div>
        </div>`;
    }

    function renderError() {
      subtitle.hidden = true;
      searchBox.hidden = true;
      view.innerHTML = `
        <div class="center-state">
          <div class="state-box" role="alert">
            <div class="state-icon danger" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>
            </div>
            <h2>We couldn't load your books</h2>
            <p>Check your connection, then try again.</p>
            <div class="state-actions">
              <button type="button" class="btn btn-primary" id="retryBtn">Retry</button>
            </div>
          </div>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', load);
    }

    /* ── Data ────────────────────────────────── */

    let userId = null;

    async function loadUsage() {
      const [settings, usage] = await Promise.all([kdp.ensureUserSettings(userId), kdp.getMonthUsage()]);
      if (settings.error || !settings.data || usage.error) return null;
      const limit = settings.data.monthly_token_limit;
      const pct = limit > 0 ? Math.min(100, Math.round((usage.tokens / limit) * 100)) : 0;
      // The server counts from the 1st of the month in UTC.
      const now = new Date();
      const resets = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      return { pct, resets };
    }

    async function load() {
      subtitle.hidden = false;
      searchBox.hidden = false;
      renderLoading();

      const usagePromise = loadUsage().catch(() => null);
      let result;
      try { result = await kdp.listBooks(); } catch (e) { result = { error: e }; }
      if (result.error) { renderError(); return; }

      books = result.data || [];
      if (!books.length) { renderEmpty(); return; }

      const stats = { inProgress: books.filter((b) => b.status === 'in_progress').length, usage: undefined };
      renderList(stats);
      stats.usage = await usagePromise;
      renderList(stats);
    }

    /* ── Events ──────────────────────────────── */

    // Keep the stats that are on screen; only the list changes.
    const rerender = () => renderList(lastStats);

    let noticeTimer = null;
    function showNotice(text) {
      notice.innerHTML = CHECK_ICON;
      notice.append(text);
      notice.hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => { notice.hidden = true; }, 8000);
    }

    const bookById = (id) => books.find((b) => b.id === id);

    kdpBookActions.init({
      bookHref,
      getTitle: (id) => { const b = bookById(id); return b ? workingTitle(b) : ''; },
      onRenamed(id, row) {
        const b = bookById(id);
        if (b) Object.assign(b, { title: row.title, updated_at: row.updated_at });
        rerender();
        showNotice(`Renamed to “${row.title}”.`);
      },
      onDeleted(id, title) {
        // Where focus goes: the next card's ⋯, else the previous one.
        const shownIds = books.filter(matches).map((b) => b.id);
        const at = shownIds.indexOf(id);
        books = books.filter((b) => b.id !== id);
        showNotice(`Deleted “${title}”.`);
        if (!books.length) {
          renderEmpty();
          const h = view.querySelector('h2');
          h.tabIndex = -1;
          h.focus();
          return;
        }
        lastStats = { ...lastStats, inProgress: books.filter((b) => b.status === 'in_progress').length };
        rerender();
        const rest = shownIds.filter((x) => x !== id);
        const nextId = rest[Math.min(Math.max(at, 0), rest.length - 1)];
        const target = nextId
          ? view.querySelector(`[data-book-menu="${CSS.escape(nextId)}"]`)
          : view.querySelector(`[data-filter="${filter}"]`);
        if (target) target.focus();
      }
    });

    view.addEventListener('click', (e) => {
      const tab = e.target.closest('[data-filter]');
      if (tab) { filter = tab.dataset.filter; rerender(); view.querySelector(`[data-filter="${filter}"]`).focus(); }
      if (e.target.closest('[data-clear]')) { searchEl.value = ''; query = ''; rerender(); searchEl.focus(); }
    });
    searchEl.addEventListener('input', () => {
      query = searchEl.value.trim().toLowerCase();
      if (books.length) rerender();
    });

    /* ── Start ───────────────────────────────── */

    const user = await kdpShell.init({ active: 'books' });
    if (!user) return;
    userId = user.id;
    load();
  })();
  </script>
</body>
</html>
