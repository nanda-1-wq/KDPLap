<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Reset password · KDP Lab</title>
  <link rel="icon" href="design/logo/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design/design-tokens.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth">
    <main class="auth-main">
      <a class="auth-logo" href="index.html" aria-label="KDP Lab home">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path class="mark" d="M32 49C26 43.5 17 41.5 9 43V13c9-1.8 17 .6 23 7z"/><path class="mark" d="M32 49C38 43.5 47 41.5 55 43V13c-9-1.8-17 .6-23 7z"/><path class="cut" d="M32 18.5l6 11.5-6 19.5-6-19.5z"/><path class="spine" d="M32 30V46" stroke-width="2"/></svg>
        <span class="auth-logo-text"><span class="kdp">KDP</span><span class="lab">LAB</span></span>
      </a>

      <div class="auth-center">
        <div class="auth-stack">
          <div class="auth-head">
            <h1>Reset your password</h1>
            <p>Enter your email. We'll send you a link to set a new password.</p>
          </div>

          <div id="formAlert" hidden></div>

          <form id="resetForm" class="auth-stack" novalidate>
            <label class="field">
              <span class="field-top">Email</span>
              <span class="field-box">
                <input class="input" type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error" />
              </span>
              <span class="field-error" id="email-error" hidden></span>
            </label>
            <button type="submit" class="btn btn-primary" id="submitBtn">Send reset link</button>
          </form>

          <a class="back-link" href="login.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            Back to sign in
          </a>
        </div>
      </div>

      <p class="auth-legal">KDP is a trademark of Amazon. KDP Lab is independent and not affiliated with Amazon.</p>
    </main>
    <aside class="auth-panel" aria-hidden="true" data-auth-panel></aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
    integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT"
    crossorigin="anonymous"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      const A = window.kdpAuth;
      const form = document.getElementById('resetForm');
      const emailEl = document.getElementById('email');
      const submitBtn = document.getElementById('submitBtn');
      const alertEl = document.getElementById('formAlert');

      A.fillPanel();
      A.redirectIfSignedIn();

      emailEl.addEventListener('input', () => A.setFieldError(emailEl, ''));

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        A.hideAlert(alertEl);
        if (!A.checkEmail(emailEl)) { emailEl.focus(); return; }

        const email = emailEl.value.trim();
        A.setLoading(submitBtn, true, 'Sending…');
        const { error } = await kdp.resetPassword(email);
        A.setLoading(submitBtn, false);

        // Only a network problem or a rate limit is shown as an error.
        // Anything else gets the same message, so the page never reveals
        // whether an account exists.
        const problem = error && A.networkMessage(error);
        if (problem) {
          A.showAlert(alertEl, 'error', problem);
          return;
        }
        form.hidden = true;
        A.showAlert(alertEl, 'success',
          ['If an account exists for ', { strong: email }, ', a reset link is on its way. It works for 1 hour.']);
      });
    })();
  </script>
</body>
</html>
