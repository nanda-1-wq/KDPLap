<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — KDP Lab</title>
<meta name="description" content="Reset your KDP Lab password."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --violet:#7C3AED;--violet-mid:#9D6FEC;--violet-pale:#EDE9FE;
  --violet-border:rgba(124,58,237,.12);--violet-border-strong:rgba(124,58,237,.25);
  --white:#fff;--off-white:#F8F7FF;
  --text:#1A0A3C;--text-mid:#5B4B8A;--text-muted:#9585C0;
  --shadow-md:0 8px 40px rgba(124,58,237,.14);
  --shadow-btn:0 4px 20px rgba(124,58,237,.35);
  --shadow-btn-hover:0 8px 32px rgba(124,58,237,.45);
  --gradient-hero-bg:linear-gradient(170deg,#EDE9FE 0%,#F8F7FF 45%,#fff 100%);
  --gradient-primary:linear-gradient(135deg,#7C3AED 0%,#9D6FEC 100%);
  --font-display:'JetBrains Mono',monospace;
  --font-body:'DM Sans',sans-serif;
}
body{
  font-family:var(--font-body);
  background:var(--gradient-hero-bg);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px 16px;color:var(--text);
}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:28px;}
.logo-icon{width:34px;height:34px;border-radius:9px;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:18px;height:18px;fill:white;}
.logo-name{font-family:var(--font-display);font-size:19px;font-weight:800;color:var(--text);letter-spacing:-0.5px;}
.logo-name em{font-style:italic;color:var(--violet);}
.card{
  width:100%;max-width:420px;background:var(--white);
  border-radius:20px;box-shadow:var(--shadow-md);
  border:1px solid var(--violet-border);padding:36px 32px 32px;
}
@media(max-width:480px){.card{padding:28px 20px 24px;}}
.card-icon{
  width:48px;height:48px;border-radius:12px;
  background:var(--violet-pale);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
}
.card-icon svg{width:22px;height:22px;color:var(--violet);}
.card-title{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.5px;color:var(--text);margin-bottom:4px;}
.card-sub{font-size:14px;color:var(--text-muted);margin-bottom:28px;line-height:1.5;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:16px;}
.field-label{font-size:11px;font-weight:500;color:var(--text-mid);text-transform:uppercase;letter-spacing:.6px;}
input{
  font-family:var(--font-body);font-size:14px;color:var(--text);
  background:var(--white);border:1px solid var(--violet-border-strong);
  border-radius:10px;padding:11px 14px;outline:none;width:100%;
  transition:border-color .2s,box-shadow .2s;
}
input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.12);}
input.error{border-color:#ef4444;}
input::placeholder{color:var(--text-muted);}
.err-msg{font-size:11px;color:#ef4444;margin-top:3px;display:none;}
.err-msg.show{display:block;}
.btn-primary{
  width:100%;padding:12px;
  font-family:var(--font-body);font-size:15px;font-weight:500;
  color:#fff;border:none;cursor:pointer;
  background:var(--gradient-primary);border-radius:10px;
  box-shadow:var(--shadow-btn);
  transition:box-shadow .25s,transform .2s,opacity .2s;
  position:relative;overflow:hidden;
}
.btn-primary::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.1);opacity:0;transition:opacity .2s;}
.btn-primary:hover{box-shadow:var(--shadow-btn-hover);transform:translateY(-1px);}
.btn-primary:hover::before{opacity:1;}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.alert{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:16px;display:none;}
.alert.show{display:block;}
.alert-error{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;}
.alert-success{background:#f0fdf4;border:1px solid #86efac;color:#166534;}
.card-footer{margin-top:22px;text-align:center;font-size:13px;color:var(--text-muted);}
.card-footer a{color:var(--violet);text-decoration:none;font-weight:500;}
.card-footer a:hover{text-decoration:underline;}
/* Success state */
.success-state{text-align:center;display:none;}
.success-state.show{display:block;}
.success-icon{width:56px;height:56px;border-radius:50%;background:var(--violet-pale);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.success-icon svg{width:26px;height:26px;color:var(--violet);}
.success-title{font-family:var(--font-display);font-size:18px;font-weight:800;color:var(--text);margin-bottom:8px;}
.success-body{font-size:14px;color:var(--text-muted);line-height:1.6;}
.form-area.hidden{display:none;}
</style>
</head>
<body>

<a class="logo" href="landing/index.html">
  <div class="logo-icon">
    <svg viewBox="0 0 20 20"><rect x="3" y="2" width="8" height="10" rx="1.5"/><rect x="9" y="6" width="8" height="10" rx="1.5" opacity=".7"/><rect x="6" y="10" width="8" height="7" rx="1.5" opacity=".5"/></svg>
  </div>
  <span class="logo-name">KDP <em>Lab</em></span>
</a>

<div class="card">
  <div class="form-area" id="formArea">
    <div class="card-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </div>
    <h1 class="card-title">Forgot password?</h1>
    <p class="card-sub">No problem. Enter your email and we'll send you a reset link.</p>

    <div class="alert alert-error" id="globalError"></div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input id="email" type="email" placeholder="jane@example.com" autocomplete="email"/>
        <span class="err-msg" id="emailErr">Please enter a valid email address.</span>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Send Reset Link</button>
    </form>
  </div>

  <div class="success-state" id="successState">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    </div>
    <div class="success-title">Check your inbox</div>
    <p class="success-body">We sent a password reset link to <strong id="confirmedEmail"></strong>. Check your spam folder if it doesn't arrive within a minute.</p>
  </div>

  <div class="card-footer">
    <a href="login.html">← Back to login</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
        integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT"
        crossorigin="anonymous"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  const form     = document.getElementById('resetForm');
  const emailEl  = document.getElementById('email');
  const submitBtn= document.getElementById('submitBtn');
  const globalErr= document.getElementById('globalError');
  const formArea = document.getElementById('formArea');
  const successSt= document.getElementById('successState');
  const confEmail= document.getElementById('confirmedEmail');

  function setGlobal(msg){ globalErr.textContent = msg; globalErr.classList.add('show'); }
  function clearGlobal(){ globalErr.classList.remove('show'); }
  function showErr(el, msgEl){ el.classList.add('error'); msgEl.classList.add('show'); }
  function clearErr(el, msgEl){ el.classList.remove('error'); msgEl.classList.remove('show'); }

  emailEl.addEventListener('input', () => clearErr(emailEl, document.getElementById('emailErr')));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearGlobal();

    const email = emailEl.value.trim();
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showErr(emailEl, document.getElementById('emailErr')); return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    const { error } = await kdp.resetPassword(email);

    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Reset Link';

    if (error) {
      setGlobal(error.message); return;
    }

    confEmail.textContent = email;
    formArea.classList.add('hidden');
    successSt.classList.add('show');
  });
})();
</script>
</body>
</html>
